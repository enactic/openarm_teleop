name: Test
on:
  push:
    branches:
      - '**'
      - '!dependabot/**'
    tags:
      - '**'
  pull_request:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install pre-commit
        run: |
          python -m pip install pre-commit
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files

  build:
    name: Build
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y software-properties-common
          sudo add-apt-repository -y ppa:openarm/main
          sudo apt install -y -V \
            cmake \
            libkdl-parser-dev \
            libopenarm-can-dev \
            liborocos-kdl-dev \
            liburdfdom-headers-dev \
            libyaml-cpp-dev \
            ninja-build \
            python3-pytest
      - uses: actions/checkout@v7
        with:
          path: openarm_can
          repository: enactic/openarm_can
      - name: CMake
        run: |
          cmake \
            -B build \
            -S . \
            -GNinja \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: |
          ninja -C build
      - name: Prepare virtual CAN interfaces
        run: |
          # vcan.ko is in linux-modules-extra-* on some kernels such as
          # 6.8 but in linux-modules-* on others such as 7.0.
          if ! sudo modprobe vcan; then
            sudo apt install -y -V linux-modules-extra-$(uname -r)
            sudo modprobe vcan
          fi
          for interface in vcan0 vcan1; do
            sudo ip link add dev ${interface} type vcan
            # For CAN FD
            sudo ip link set dev ${interface} mtu 72
            sudo ip link set dev ${interface} up
          done
      - name: Test
        env:
          OPENARM_TELEOP_TEST_LEADER_INTERFACE: vcan0
          OPENARM_TELEOP_TEST_FOLLOWER_INTERFACE: vcan1
        run: |
          ctest --test-dir build --output-on-failure
      - name: Install
        run: |
          ninja -C build install
